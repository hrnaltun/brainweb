{% load static %}

<style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    header {
      background-color: #868484;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .left {
      display: flex;
      align-items: center;
    }

    .left img {
      width: 120px;
      height: auto;
    }

    .right {
      display: flex;
      align-items: center;
      margin-right: 20px;
    }

    .right a {
      text-decoration: none;
      color: #fff;
      margin-left: 20px;
    }

    /* Sağdaki bağlantıları ortalamak için */
    .right {
      margin-left: auto;
    }
</style>
</head>
<body>
  <header>
    <div class="left">
      <img src="{% static "img/logo.png" %}" alt="Logo">
    </div>
    <div class="right">
      <a href="{% url 'home' %}">Ana Sayfa</a>
      <a href="/service">Hizmetler</a>
      <a href="#">Giriş Yap</a>
    </div>
  </header>
</body>
</html>
