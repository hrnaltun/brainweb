{% load static %}

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'guest/css/gueststyle.css' %}">
    <title>BrainWeb</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f2f2f2; /* Açık gri arkaplan */
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        img {
            margin-top: 10px;
        }
        .feedback {
            margin-top: 30px;
        }
        .button {
            margin-top: 50px;
            background-color: #4CAF50;
            color: white;
            padding: 15px 25px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
            {% include "account/accountheader.html" %}
    </header>
    <div class="container"style="margin-top: 100px;">
        <h1>{{ servis.adı }}</h1>
        <p>{{ servis.açıklama_kısa }}</p>
        <img src="{{ servis.resim_kücük.url }}" alt="İndir" width="50">
        <div class="feedback">
            <h2>Geri Bildirim</h2>
            <p>{{ servis.açıklama_uzun }}</p>
            <img src="{{ servis.resim_büyük.url }}" alt="İndir" width="50">
        </div>
        <a href="#" class="button">Kullan</a>
    </div>
    <footer>
        {% include "account/accountfooter.html" %}
    </footer>
</body>
</html>
