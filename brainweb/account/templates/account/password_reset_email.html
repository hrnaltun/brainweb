{% autoescape off %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Şifre Sıfırlama</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #3498db; color: white; margin: 0; padding: 0; text-align: center;">
    <div style="padding: 20px;">
        <div style="background-color: white; color: #333; padding: 20px; border-radius: 8px; display: inline-block; text-align: left; max-width: 600px; margin: 0 auto;">
            <h2 style="text-align: center;">Merhaba {{ user.username }},</h2>
            <p>Şifrenizi sıfırlamak için aşağıdaki bağlantıya tıklayın:</p>
            <p style="text-align: center;">
                <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}" style="display: inline-block; padding: 10px 20px; background-color: #007bff; color: white; text-decoration: none; border-radius: 5px;">Şifre Sıfırlama Bağlantısı</a>
            </p>
            <p>Eğer bu isteği siz yapmadıysanız bu e-postayı dikkate almayın.</p>
        </div>
        <div style="margin-top: 20px; font-size: 0.8em;">
            <p>&copy; 2024 BrainWeb. Tüm hakları saklıdır.</p>
        </div>
    </div>
</body>
</html>
{% endautoescape %}
