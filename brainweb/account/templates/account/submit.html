{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boru Hattı Seçimi</title>
    <link rel="stylesheet" href="{% static 'account/css/submitstyle.css'%}">
</head>
<body>   
    <header>
        {% include "account/accountheader.html" %}
    </header>
    <div class="container" style="margin-top: 100px;">
        <h1>Boru Hattı Seçimi</h1>
        <div class="pipeline-buttons">
            {% for servis in servisler %}
            <div class="pipeline-button" data-service-id="{{ servis.id }}">
                <img src="{{ servis.resim_kücük.url }}" alt="{{ servis.adı }}">
                <span>{{ servis.adı }}</span>
            </div>
            {% endfor %}
        </div>
    </div>
    
    <div class="content">
        <div id="dynamic-content" class="hidden">
            <p id="description">Açıklama metni buraya gelecek</p>
            <div class="file-upload-container">
                <label for="file-upload" class="file-upload-label">Dosya Seç</label>
                <input type="file" id="file-upload" class="visually-hidden">
                <span id="file-name" class="file-name"></span>
            </div>
            <button id="submit-button">Gönder</button>
        </div>         
    </div>
    <footer>
        {% include "account/accountfooter.html" %}
    </footer>
    <script src="{% static 'account/js/submit.js'%}"></script>

</body>
</html>
