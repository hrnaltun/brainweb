{% extends "loginbase.html"%}
{% load static %}
{% block header %}
{% include "account/loginheader.html" %}
{% endblock %}
{% block content %}
<section class="container">
    <div class="account-container">
        <div class="form-container">
            <img src="{% static 'img/logo.png' %}" alt="Logo" class="logo img-fluid" />

            <form method="POST" action="{% url 'register' %}" class="login-form">
                {% csrf_token %}
                {% if error %}
                <div class="alert alert-danger">
                    {{ error }}
                </div>
                {% endif %}
                <style>
                    .form-group label {
                        color: white;
                    }
                </style>
                <div class="form-group row required">
                    <label for="first_name" class="col">İsim</label>
                    <input type="text" class="form-control" id="first_name" name="first_name" required>
                </div>
                <div class="form-group row required">
                    <label for="last_name" class="col">Soyisim</label>
                    <input type="text" class="form-control" id="last_name" name="last_name" required>
                </div>
                <div class="form-group row required">
                    <label for="email" class="col">E-Posta</label>
                    <input type="email" class="form-control" id="email" name="email">
                </div>
                <div class="form-group row required">
                    <label for="password" class="col">Şifre</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <div class="form-group row required">
                    <label for="password_confirm" class="col">Şifreyi Onayla</label>
                    <input type="password" class="form-control" id="password_confirm" name="password_confirm" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Kayıt Ol</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
