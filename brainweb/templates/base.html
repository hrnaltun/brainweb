{% load static %}
<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'guest/css/style.css' %}">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>BrainWeb</title>
</head>

<body>
    <header class="container-fluid text-white" >
        {% block header %}
        <!-- Header content -->
        {% endblock %}
    </header>

    <main>
        {% block content %}
        <!-- Content -->
        {% endblock %}
    </main>

    <footer class="container-fluid text-white">
        {% block footer %}
        <!-- Footer content -->
        {% endblock %}
    </footer>

</body>

</html>
